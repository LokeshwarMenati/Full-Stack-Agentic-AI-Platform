services:
  # NEXUS AI FastAPI Backend Service
  - type: web
    name: nexus-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python backend/scripts/seed_data.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: FRONTEND_ORIGIN
        value: "https://full-stack-agentic-ai-platform.vercel.app,http://localhost:5173"
